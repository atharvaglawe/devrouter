    const hasOrphans = orphans.callersByDepth.size || orphans.calleesByDepth.size || orphans.aux.length;
    if (hasOrphans) {
      sortBuckets(orphans.callersByDepth);
      sortBuckets(orphans.calleesByDepth);
      orphans.aux.sort((a, b) => a.name.localeCompare(b.name));
      groups.push(orphans);
    }
    return groups;
  }

  // renderCallGraph draws the codegraph subgraph as a *banded multi-depth*
  // column layout. Each seed gets its own vertical band; within a band
  // there's one column per BFS depth on each side of the seed:
  //
  //   callers d=-N ... d=-2  d=-1   SEEDS   d=+1  d=+2 ... d=+N   aux
  //
  // So at maxDepth=1 the layout collapses to the familiar
  // callers / seeds / callees / aux quad; at maxDepth=5 there are up
  // to 11 columns (5 caller depths + seed + 5 callee depths + aux).
  // CALLS edges between adjacent depth columns make the chain visible
  // — readers can trace "Add → Get → AddToCommands → composeKey → ..."
  // by following edges across depth columns within the same band.
  //
  // The layout is fully deterministic so the same flow renders
  // identically on every reload (no force simulation, alphabetical
  // sort within each depth bucket).
  function renderCallGraph(sg, {preview, maxDepth, flow} = {preview: true, maxDepth: 1, flow: null}) {
    // Feedback overlay classification (file -> {state, useful, dead}).
    // Pulled in here so the band/node renderers can stamp ov-validated
    // / ov-dead onto the right <rect>s as they emit them. classify()
    // returns null when there's no signal for a path, in which case
    // we fall through to the base role styling unchanged.
    const overlay = flow ? buildFileClassification(flow) : { classify: () => null, missing: [] };
    const depth = Math.max(1, Math.min(MAX_DEPTH, maxDepth));
    const groupsAll = bandGroups(sg);
    if (!groupsAll.length) return '';

    const seedCap = preview ? PREVIEW_CAPS.seeds : Infinity;
    const perColCap = preview ? PREVIEW_CAPS.perColumn : Infinity;

    // Trim by seed count (preview only) and then by depth + per-column
    // caps. Per-band totals get tracked so we can emit "+N more" tags.
    const visibleGroups = groupsAll.slice(0, seedCap).map(g => {
      const callerCols = []; // [{depth, nodes, hidden}], depth=-1, -2, ...
      for (let d = -1; d >= -depth; d--) {
        const arr = g.callersByDepth.get(d) || [];
        const visible = arr.slice(0, perColCap);
        const hidden = arr.length - visible.length;
        if (visible.length || hidden) callerCols.push({depth: d, nodes: visible, hidden});
      }
      const calleeCols = []; // depth=+1, +2, ...
      for (let d = 1; d <= depth; d++) {
        const arr = g.calleesByDepth.get(d) || [];
        const visible = arr.slice(0, perColCap);
        const hidden = arr.length - visible.length;
        if (visible.length || hidden) calleeCols.push({depth: d, nodes: visible, hidden});
      }
      const aux = g.aux.slice(0, perColCap);
      const auxHidden = g.aux.length - aux.length;
      return {seed: g.seed, callerCols, calleeCols, aux, auxHidden};
    });
    const hiddenSeeds = Math.max(0, groupsAll.length - visibleGroups.length);

    // Figure out which depth columns actually have content across any
    // band — drop empty ones to keep the layout tight. Caller columns
    // sort left-to-right by depth ascending (i.e. -5, -4, ..., -1 next
    // to seed). Callee columns sort right-to-left by depth descending
    // (1, 2, ..., 5 with 5 being furthest right before aux).
    const activeCallerDepths = new Set();
    const activeCalleeDepths = new Set();
    let hasAnyAux = false;
    visibleGroups.forEach(b => {
      b.callerCols.forEach(c => activeCallerDepths.add(c.depth));
      b.calleeCols.forEach(c => activeCalleeDepths.add(c.depth));
      if (b.aux.length || b.auxHidden) hasAnyAux = true;
    });
    const callerDepthList = Array.from(activeCallerDepths).sort((a, b) => a - b); // -5..-1
    const calleeDepthList = Array.from(activeCalleeDepths).sort((a, b) => a - b); //  1..5

    // Column descriptors. `key` is the lookup key for x-position and
    // the "is this column visible?" check.
    const columns = [];
    callerDepthList.forEach(d => columns.push({
      key: `c${d}`,
      label: d === -1 ? 'callers' : `callers d=${-d}`,
      kind: 'caller',
      depth: d,
    }));
    columns.push({key: 's', label: 'seeds', kind: 'seed'});
    calleeDepthList.forEach(d => columns.push({
      key: `e${d}`,
      label: d === 1 ? 'callees' : `callees d=${d}`,
      kind: 'callee',
      depth: d,
    }));
    if (hasAnyAux) columns.push({key: 'aux', label: 'related', kind: 'aux'});

    const nodeW = 230, nodeH = 38, rowH = 44;
    const padX = 14, padY = 30, colGap = 70, bandGap = 18;
    const colX = {};
    columns.forEach((c, i) => { colX[c.key] = padX + i * (nodeW + colGap); });
    const width = padX * 2 + columns.length * nodeW + (columns.length - 1) * colGap;

    // Per-band layout. Each band's height is the tallest column for
    // that band (counting +N marker rows). The seed sits at the band's
    // vertical centre so connecting edges fan symmetrically.
    const visiblePos = new Map();
    let cursorY = padY + 14;
    const bandRecords = [];
    visibleGroups.forEach(b => {
      // Helper: rows needed in a given depth column (visible + marker).
      const callerRows = d => {
        const col = b.callerCols.find(c => c.depth === d);
        return col ? col.nodes.length + (col.hidden ? 1 : 0) : 0;
      };
      const calleeRows = d => {
        const col = b.calleeCols.find(c => c.depth === d);
        return col ? col.nodes.length + (col.hidden ? 1 : 0) : 0;
      };
      let maxRows = 1; // seed alone
      callerDepthList.forEach(d => { maxRows = Math.max(maxRows, callerRows(d)); });
      calleeDepthList.forEach(d => { maxRows = Math.max(maxRows, calleeRows(d)); });
      if (b.aux.length || b.auxHidden) maxRows = Math.max(maxRows, b.aux.length + (b.auxHidden ? 1 : 0));

      const height = maxRows * rowH;
      const seedY = cursorY + (height - nodeH) / 2;
      bandRecords.push({startY: cursorY, height, seedY, b});

      // Place every node in its column at its band-relative slot.
      b.callerCols.forEach(col => {
        col.nodes.forEach((n, i) => visiblePos.set(n.name,
          {x: colX[`c${col.depth}`], y: cursorY + i * rowH, col: `c${col.depth}`}));
      });
      // The trailing orphans band has seed=null by design — it gathers
      // nodes whose chain didn't terminate at any seed in the snapshot.
      // Skipping its seed-position write lets the orphan-band columns
      // still place correctly (the same forEach blocks above and below
      // populate them); the matching renderNode call at the bottom is
      // already `if (b.seed)`-guarded so the missing seed rect is fine.
      if (b.seed) {
        visiblePos.set(b.seed.name, {x: colX.s, y: seedY, col: 's'});
      }
      b.calleeCols.forEach(col => {
        col.nodes.forEach((n, i) => visiblePos.set(n.name,
          {x: colX[`e${col.depth}`], y: cursorY + i * rowH, col: `e${col.depth}`}));
      });
      b.aux.forEach((n, i) => visiblePos.set(n.name,
        {x: colX.aux, y: cursorY + i * rowH, col: 'aux'}));

      cursorY += height + bandGap;
    });
    const contentBottom = cursorY - bandGap;
    const moreSeedsY = hiddenSeeds > 0 ? contentBottom + 20 : contentBottom;
    const height = moreSeedsY + padY;

    const svgClass = preview ? 'flow-svg' : 'flow-svg full';
    // Cap preview SVGs at their native pixel width so a sparse flow
    // (one or two columns of content) doesn't get scaled up to panel
    // width, blowing up text to absurd sizes. The viewBox keeps the
    // shrink-to-fit behaviour for normal-width graphs.
    const sizeAttrs = preview
      ? `viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMinYMin meet" style="max-width:${width}px"`
      : `width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"`;
    let svg = `<svg class="${svgClass}" ${sizeAttrs}>`;

    columns.forEach(c => {
      svg += `<text class="col-label" x="${colX[c.key] + nodeW / 2}" y="${padY + 4}">${fmt.escape(c.label)}</text>`;
    });

    for (let i = 1; i < bandRecords.length; i++) {
      const y = bandRecords[i].startY - bandGap / 2;
      svg += `<line class="band-divider" x1="${padX}" y1="${y}" x2="${width - padX}" y2="${y}"/>`;
    }

    // Edges. Both endpoints have to be in visiblePos or we'd dangle.
    // Same-column edges get a tiny bypass loop (rare; happens when
    // two seeds reference each other).
    (sg.edges || []).forEach(e => {
      const a = visiblePos.get(e.from);
      const b = visiblePos.get(e.to);
      if (!a || !b) return;
      const x1 = a.x + nodeW, y1 = a.y + nodeH / 2;
      const x2 = b.x,         y2 = b.y + nodeH / 2;
      let d;
      if (a.col === b.col) {
        const loopX = a.x + nodeW + 18;
        d = `M${x1} ${y1} C ${loopX} ${y1}, ${loopX} ${y2}, ${x2 + nodeW} ${y2}`;
      } else {
        const mx = (x1 + x2) / 2;
        d = `M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
      }
      svg += `<path class="edge-${e.type || 'CALLS'}" d="${d}" fill="none"/>`;
    });

    // Nodes are two-line: primary on top, secondary below. For
    // function-level nodes that's "symbol" / "file basename"; for
    // file-level nodes (post-collapse, where n.name is the full path
    // and equals n.file) it's "basename" / "dirname/".
    const labelCap = preview ? 32 : 60;
    const fileCap  = preview ? 28 : 50;
    const renderNode = (n, p) => {
      const glyph = n.role === 'seed'   ? '▸'
                  : n.role === 'caller' ? '↑'
                  : n.role === 'callee' ? '↓'
                  : '·';
      const baseCls = 'node-' + (n.role || 'callee');
      const fileFull = n.file || '';
      // File-level nodes have name === full path. Detect that here so
      // the renderer keeps a single code path for both granularities.
      const isFileNode = !!fileFull && n.name === fileFull && fileFull.indexOf('/') >= 0;
      const fileBase = fileFull ? (fileFull.split('/').pop() || fileFull) : '';
      const fileDir = isFileNode
        ? fileFull.slice(0, fileFull.length - fileBase.length).replace(/\/$/, '') + '/'
        : '';
      const primaryText = isFileNode ? fileBase : n.name;
      const secondaryText = isFileNode ? fileDir : fileBase;
      // Overlay tint + badge. Seeds skip the tint because the seed
      // colour is the strongest visual signal in the graph — wrapping
      // it in a green/grey ring fights for attention with the seed's
      // own role. For callers / callees / aux nodes the tint is the
      // whole point.
      const ov = (n.role !== 'seed') ? overlay.classify(fileFull) : null;
      const cls  = ov ? `${baseCls} ov-${ov.state}` : baseCls;
      const ovTitle = ov ? ` · ${ov.useful}✓/${ov.dead}✗` : '';
      const title = fileFull && !isFileNode
        ? `${n.name} — ${fileFull}${ovTitle}`
        : `${n.name}${ovTitle}`;
      const symbolY = secondaryText ? p.y + 16 : p.y + 23;
      let out = `<g><title>${fmt.escape(title)}</title>`;
      out += `<rect class="${cls}" x="${p.x}" y="${p.y}" width="${nodeW}" height="${nodeH}" rx="4"/>`;
      out += `<text class="node-text" x="${p.x + 8}" y="${symbolY}">${glyph} ${fmt.escape(fmt.truncate(primaryText, labelCap))}</text>`;
      if (secondaryText) {
        out += `<text class="node-file-text" x="${p.x + 16}" y="${p.y + 30}">${fmt.escape(fmt.truncate(secondaryText, fileCap))}</text>`;
      }
      if (ov) {
        // Tiny corner badge: "+N✓" for validated, "−N✗" for dead.
        // Rendered top-right of the rect so it doesn't overlap with
        // the file basename baseline.
        const badgeText = ov.state === 'validated'
          ? `${ov.useful}✓` + (ov.dead ? ` / ${ov.dead}✗` : '')
          : `${ov.dead}✗` + (ov.useful ? ` / ${ov.useful}✓` : '');
        out += `<text class="ov-badge ${ov.state === 'validated' ? 'useful' : 'dead'}" x="${p.x + nodeW - 6}" y="${p.y + 12}" text-anchor="end">${badgeText}</text>`;
      }
      out += `</g>`;
      return out;
    };

    bandRecords.forEach(({b}) => {
      if (b.seed) svg += renderNode(b.seed, visiblePos.get(b.seed.name));
      b.callerCols.forEach(col => col.nodes.forEach(n => svg += renderNode(n, visiblePos.get(n.name))));
      b.calleeCols.forEach(col => col.nodes.forEach(n => svg += renderNode(n, visiblePos.get(n.name))));
      b.aux.forEach(n => svg += renderNode(n, visiblePos.get(n.name)));
    });

    // Per-band +N more indicators.
    bandRecords.forEach(({startY, b}) => {
      b.callerCols.forEach(col => {
        if (!col.hidden) return;
        const y = startY + col.nodes.length * rowH + 12;
        svg += `<text class="col-more" x="${colX[`c${col.depth}`] + nodeW / 2}" y="${y}">+${col.hidden} more</text>`;
      });
      b.calleeCols.forEach(col => {
        if (!col.hidden) return;
        const y = startY + col.nodes.length * rowH + 12;
        svg += `<text class="col-more" x="${colX[`e${col.depth}`] + nodeW / 2}" y="${y}">+${col.hidden} more</text>`;
      });
      if (b.auxHidden) {
        const y = startY + b.aux.length * rowH + 12;
        svg += `<text class="col-more" x="${colX.aux + nodeW / 2}" y="${y}">+${b.auxHidden} more</text>`;
      }
    });

    if (hiddenSeeds > 0) {
      svg += `<text class="col-more" x="${width / 2}" y="${moreSeedsY}">+${hiddenSeeds} more seed${hiddenSeeds === 1 ? '' : 's'} (expand to view)</text>`;
    }

    svg += '</svg>';

    const allRoles = new Set((sg.nodes || []).map(n => n.role));
    const legendItems = [
      { role: 'seed',     label: 'entry point' },
      { role: 'caller',   label: 'caller' },
      { role: 'callee',   label: 'callee' },
      { role: 'method',   label: 'method' },
      { role: 'extends',  label: 'extends' },
      { role: 'importer', label: 'imports' },
    ].filter(it => allRoles.has(it.role));
    let legend = `<div class="flow-svg-legend">`;
    legendItems.forEach(it => {
      legend += `<span><span class="swatch node-${it.role}"></span>${it.label}</span>`;
    });
    // Overlay swatches only show up when the flow has any feedback —
    // keeps the legend honest about whether the ov-* tints can appear.
    if (flow && flow.total_feedback) {
      legend += `<span><span class="swatch ov-swatch validated"></span>validated (agent read it)</span>`;
      legend += `<span><span class="swatch ov-swatch dead"></span>dead-weight (agent finished w/o it)</span>`;
      if ((flow.augmented_files || []).length) {
        legend += `<span><span class="swatch ov-swatch missing"></span>missing (reported below)</span>`;
      }
    }
    if (sg.truncated && !preview) {
      legend += `<span class="truncated">codegraph snapshot was capped at save time — some neighbours weren't recorded</span>`;
    }
    legend += `</div>`;

    const keyAttr = (!preview && flow && flow.repo != null && flow.name != null)
      ? ` data-flow-scroll="${fmt.escape((flow.repo || '') + '::' + flow.name)}"`
      : '';
    return preview
      ? svg + legend
      : `<div class="flow-full-wrap"${keyAttr}>${svg}</div>${legend}`;
  }

  // renderBipartiteSVG is the legacy renderer kept around for flows
  // saved without a codegraph snapshot (entry_points empty, codegraph
  // offline at save time, or pre-snapshot-feature flows still in
  // Redis). Same shape as before the codegraph integration, with the
  // same preview/full split as renderCallGraph.
  function renderBipartiteSVG(flow, {preview} = {preview: true}) {
    const allEntries = flow.entry_points || [];
    const allFiles   = flow.files || [];
    if (!allEntries.length && !allFiles.length) return '';
    const entries = preview ? allEntries.slice(0, PREVIEW_BIPARTITE_CAP) : allEntries;
    const files   = preview ? allFiles.slice(0,   PREVIEW_BIPARTITE_CAP) : allFiles;
    const hiddenE = allEntries.length - entries.length;
    const hiddenF = allFiles.length   - files.length;

    const rowH = 28, colGap = 220, padX = 14, padY = 18;
    const nodeW = 190, nodeH = 22;
    const maxRows = Math.max(entries.length, files.length, 1) + ((hiddenE || hiddenF) ? 1 : 0);
    const height = padY * 2 + maxRows * rowH;
    const width  = padX * 2 + nodeW + colGap;

    const svgClass = preview ? 'flow-svg' : 'flow-svg full';
    const sizeAttrs = preview
      ? `viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMinYMin meet" style="max-width:${width}px"`
      : `width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"`;
    let svg = `<svg class="${svgClass}" ${sizeAttrs}>`;

    entries.forEach((e, i) => {
      const x = padX, y = padY + i * rowH;
      svg += `<rect class="node-entry" x="${x}" y="${y}" width="${nodeW}" height="${nodeH}" rx="4"/>`;
      svg += `<text class="node-text" x="${x + 8}" y="${y + 15}">▸ ${fmt.escape(fmt.truncate(e, preview ? 30 : 60))}</text>`;
    });
    const overlay = buildFileClassification(flow);
    files.forEach((f, i) => {
      const x = padX + nodeW + colGap - nodeW, y = padY + i * rowH;
      const ov = overlay.classify(f);
      const cls = ov ? `node-file ov-${ov.state}` : 'node-file';
      svg += `<rect class="${cls}" x="${x}" y="${y}" width="${nodeW}" height="${nodeH}" rx="4"/>`;
      svg += `<text class="node-text" x="${x + 8}" y="${y + 15}">${fmt.escape(fmt.truncate(f, preview ? 30 : 60))}</text>`;
      if (ov) {
        const badgeText = ov.state === 'validated'
          ? `${ov.useful}✓` + (ov.dead ? ` / ${ov.dead}✗` : '')
          : `${ov.dead}✗` + (ov.useful ? ` / ${ov.useful}✓` : '');
        svg += `<text class="ov-badge ${ov.state === 'validated' ? 'useful' : 'dead'}" x="${x + nodeW - 6}" y="${y + 12}" text-anchor="end">${badgeText}</text>`;
      }
    });
    const ex = padX + nodeW, fx = padX + colGap;
    for (let i = 0; i < entries.length; i++) {
      for (let j = 0; j < files.length; j++) {
        const y1 = padY + i * rowH + nodeH / 2;
        const y2 = padY + j * rowH + nodeH / 2;
        const mx = (ex + fx) / 2;
        svg += `<path class="edge" d="M${ex} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${fx} ${y2}" fill="none"/>`;
      }
    }
    if (hiddenE) {
      svg += `<text class="col-more" x="${padX + nodeW/2}" y="${padY + entries.length * rowH + 14}">+${hiddenE} more</text>`;
    }
    if (hiddenF) {
      svg += `<text class="col-more" x="${padX + colGap + nodeW/2}" y="${padY + files.length * rowH + 14}">+${hiddenF} more</text>`;
    }
    svg += '</svg>';
    const keyAttr = (!preview && flow && flow.repo != null && flow.name != null)
      ? ` data-flow-scroll="${fmt.escape((flow.repo || '') + '::' + flow.name)}"`
      : '';
    return preview ? svg : `<div class="flow-full-wrap"${keyAttr}>${svg}</div>`;
  }

  // buildFileClassification turns a flow's overlay arrays into a
  // lookup callable from the SVG renderers. classify(file) returns
  // either null (no overlay match / abstain) or
  // {state, useful, dead} so the caller can stamp a CSS class and a
  // small badge on the node.
  //
  // Matching is case-insensitive substring-in-either-direction so a
  // codegraph node's `file` like "cmpkg/x/internal/foo/bar.go" still
  // matches an agent-reported overlay path like "internal/foo/bar.go"
  // (and vice versa). Ties (useful == dead) abstain — better to show
  // no signal than a misleading one.
  //
  // When several overlay rows match the same file we pick the one
  // with the highest total event count so a noisy substring collision
  // with a rarely-seen path can't outvote the dominant signal.
  function buildFileClassification(flow) {
    const stats = (flow.file_stats || []).map(s => ({ ...s, lc: (s.path || '').toLowerCase() }));
    const missing = (flow.augmented_files || []).map(a => ({ ...a, lc: (a.path || '').toLowerCase() }));
    function classify(file) {
      if (!file || !stats.length) return null;
      const f = file.toLowerCase();
      let best = null;
      for (const s of stats) {
        if (!s.lc) continue;
        const match = s.lc === f || s.lc.includes(f) || f.includes(s.lc);
        if (!match) continue;
        const total = (s.useful || 0) + (s.dead || 0);
        if (!best || total > best._total) { best = { ...s, _total: total }; }
      }
      if (!best) return null;
      if (best.useful > best.dead) return { state: 'validated', useful: best.useful, dead: best.dead };
      if (best.dead > best.useful) return { state: 'dead',      useful: best.useful, dead: best.dead };
      return null;
    }
    return { classify, missing };
  }

  // renderFlowMeta surfaces overlay aggregates as chips below the
  // graph. Returns empty string when no feedback has touched the flow
  // yet so unscored flows render exactly as they did pre-overlay.
  //
  // Chips: total events · useful · dead · missing · last-update time.
  // When agents have reported "missing" files (slice 2), each unique
  // path is listed below the chips with its hit count so devs can see
  // exactly which symbols the flow is short on.
  function renderFlowMeta(flow) {
    if (!flow.total_feedback) return '';
    let useful = 0, dead = 0;
    (flow.file_stats || []).forEach(s => { useful += (s.useful || 0); dead += (s.dead || 0); });
    let missing = 0;
    (flow.augmented_files || []).forEach(a => { missing += (a.missing || 0); });
    const augList = (flow.augmented_files || []).length
      ? `<ul class="augmented-list">${(flow.augmented_files || []).map(a =>
            `<li><span style="color:#c9b6ff;">+ ${fmt.escape(a.path)}</span> <span style="float:right;">×${a.missing}</span></li>`
          ).join('')}</ul>`
      : '';
    return `
      <div class="flow-meta">
        <span class="chip">${flow.total_feedback} feedback event${flow.total_feedback === 1 ? '' : 's'}</span>
        <span class="chip useful">${useful} useful</span>
        ${dead ? `<span class="chip dead">${dead} dead</span>` : ''}
        ${missing ? `<span class="chip missing">+${missing} missing</span>` : ''}
        <span class="chip" style="border-color:transparent;">last ${fmt.time(flow.last_feedback_at)}</span>
        ${augList}
      </div>`;
  }

  async function renderFlows() {
    const seq = ++state.flowsRenderSeq;
    try {
      // Empty repo → server returns flows across every indexed repo.
      // We rely on the per-row `repo` field (populated by LoadFlows
      // from the FT.SEARCH hit) to render a repo badge per card when
      // in the all-repos view.
      const repo = state.flowsRepo || '';
      const allFlows = await fetchJSON(`/api/flows?repo=${encodeURIComponent(repo)}`);
      // A newer render started while this request was in-flight.
      if (seq !== state.flowsRenderSeq) return;

      // Cascading facets: Topic options come from flows that satisfy
      // the *other* filter (repo) so picking a repo narrows the topic
      // dropdown, and vice-versa. Topic is multi-valued per flow (one
      // flow can be pulled in by queries under different topics) so
      // the "matches" check is membership, not equality. Mirrors the
      // matches/refillFilter pattern used by renderQueries.
      const matches = (fl, {repo, topic}) =>
        (repo  === '' || (fl.repo || '') === repo) &&
        (topic === '' || (Array.isArray(fl.topics) && fl.topics.includes(topic)));

      // Repo dropdown: still sourced from the global repo list so a
      // repo with zero flows stays selectable (matches existing UX).
      // Topic dropdown: sourced from the data because there's no
      // global "all topics that flows could possibly carry" list —
      // it's whatever queries have produced. Empty until topic
      // clustering kicks in; dropdown gracefully shows just "all".
      state.flowsRepo = refillFilter('#flows-repo', state.repos, repo);
      const topicCandidates = allFlows
        .filter(fl => matches(fl, {repo: state.flowsRepo, topic: ''}))
        .flatMap(fl => Array.isArray(fl.topics) ? fl.topics : []);
      state.flowsTopic = refillFilter('#flows-topic', topicCandidates, state.flowsTopic);

      const topic = state.flowsTopic;
      const flows = allFlows.filter(fl => matches(fl, {repo: state.flowsRepo, topic}));

      if (!flows.length) {
        const target = state.flowsRepo || 'any repo';
        const topicSuffix = topic ? ` under topic "${fmt.escape(topic)}"` : '';
        const msg = allFlows.length
          ? `No flows match the current filters${topicSuffix}. <a href="#" id="flows-reset-inline">clear filters</a>`
          : `No flows saved for ${fmt.escape(target)} yet.`;
        $('#flows-body').innerHTML = `<div class="empty">${msg}</div>`;
        const reset = $('#flows-reset-inline');
        if (reset) reset.addEventListener('click', e => {
          e.preventDefault();
          state.flowsRepo = state.flowsTopic = '';
          renderFlows();
        });
        return;
      }
      // Snapshot *right before* replacing DOM. Doing this after the
      // async fetch captures the latest user scroll position rather
      // than whatever it was when the request started.
      $$('#flows-body .flow-full-wrap[data-flow-scroll]').forEach(wrap => {
        const key = wrap.dataset.flowScroll;
        if (!key) return;
        state.flowScroll.set(key, wrap.scrollLeft);
      });
      const showRepo = !state.flowsRepo;
      $('#flows-body').innerHTML = flows.map(f => {
        const repoBadge = showRepo && f.repo
          ? `<span class="badge" style="background:#1f2937;color:#9ca3af;margin-left:6px;">${fmt.escape(f.repo)}</span>`
          : '';
        const key = `${f.repo || ''}::${f.name}`;
        const expanded = state.expandedFlows.has(key);
        const counts = flowCounts(f);
        const hasMore = counts.total > counts.shown || counts.snapshotTruncated;

        // Depth slider: only meaningful when expanded AND the snapshot
        // actually has nodes beyond 1-hop. Slider max is clamped to
        // what's actually stored so users can't ask for depth they
        // don't have — saves a confusing "I set 5 but nothing changes"
        // experience for flows snapshotted before deep BFS shipped.
        const sliderMax = Math.max(1, Math.min(MAX_DEPTH, counts.maxStoredDepth || 1));
        const currentDepth = expanded
          ? Math.max(1, Math.min(sliderMax, state.flowDepth.get(key) ?? DEFAULT_EXPANDED_DEPTH))
          : PREVIEW_DEPTH;
        const depthSlider = (expanded && sliderMax > 1)
          ? `<div class="flow-depth">
               <label for="depth-${fmt.escape(key)}">chain depth:</label>
               <input id="depth-${fmt.escape(key)}" type="range"
                      min="1" max="${sliderMax}" step="1" value="${currentDepth}"
                      data-flow-depth="${fmt.escape(key)}"
                      title="walk this many hops upstream/downstream from each entry point">
               <span class="flow-depth-value mono">${currentDepth} / ${sliderMax}</span>
             </div>`
          : '';

        const toggleBtn = hasMore
          ? `<div class="flow-actions">
               <button type="button" data-flow-toggle="${fmt.escape(key)}">
                 ${expanded ? `collapse` : `expand · showing ${counts.shown}/${counts.total}`}
               </button>
             </div>`
          : '';
        return `
        <div class="panel">
          <div class="panel-header">
            <h2>${fmt.escape(f.name)}${repoBadge}</h2>
            <div class="sub">${fmt.escape(f.source || 'agent')} · updated ${fmt.time(f.updated_at)}</div>
          </div>
          <div style="padding: 12px 16px;">
            <div style="color:var(--text); white-space: pre-wrap;">${fmt.escape(f.purpose || '')}</div>
            ${depthSlider}
            ${renderFlowSVG(f, {preview: !expanded, maxDepth: currentDepth})}
            ${toggleBtn}
            ${renderFlowMeta(f)}
          </div>
        </div>`;
      }).join('');
      // Restore horizontal scroll after DOM replacement. Use rAF so the
      // browser has applied layout/overflow metrics before setting left.
      requestAnimationFrame(() => {
        if (seq !== state.flowsRenderSeq) return;
        $$('#flows-body .flow-full-wrap[data-flow-scroll]').forEach(wrap => {
          const key = wrap.dataset.flowScroll;
          if (!key) return;
          const x = state.flowScroll.get(key);
          if (typeof x === 'number' && x > 0) wrap.scrollLeft = x;
        });
      });
      // Some browsers apply intrinsic SVG sizing one frame later; do a
      // second pass to avoid occasional snap-back-to-zero on wide graphs.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (seq !== state.flowsRenderSeq) return;
          $$('#flows-body .flow-full-wrap[data-flow-scroll]').forEach(wrap => {
            const key = wrap.dataset.flowScroll;
            if (!key) return;
            const x = state.flowScroll.get(key);
            if (typeof x === 'number' && x > 0 && wrap.scrollLeft !== x) {
              wrap.scrollLeft = x;
            }
          });
        });
      });
    } catch (e) {
      $('#flows-body').innerHTML = `<div class="empty">error: ${fmt.escape(e.message)}</div>`;
    }
  }

  // ---------- Repos & tab switching ----------
  async function refreshRepos() {
    try {
      const repos = await fetchJSON('/api/repos');
      state.repos = repos;
      // Both selects now support an "all" option (empty value). We
      // default to "all" instead of preselecting the first repo —
      // matches the convention on the Queries / Topics / Heuristics
      // tabs and lets users immediately see cross-repo activity.
      for (const id of ['decisions-repo', 'flows-repo']) {
        const sel = document.getElementById(id);
        if (!sel) continue;
        const current = sel.value;
        const opts = [`<option value="">all</option>`].concat(
          repos.map(r => `<option value="${fmt.escape(r)}">${fmt.escape(r)}</option>`));
        sel.innerHTML = opts.join('');
        const want = current && repos.includes(current) ? current : '';
        sel.value = want;
        if (id === 'decisions-repo') state.decisionsRepo = want;
        if (id === 'flows-repo') state.flowsRepo = want;
      }
    } catch (e) { /* silent */ }
  }

  function setActiveTab(tab) {
    state.tab = tab;
    $$('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    $$('main section[data-pane]').forEach(s => s.hidden = (s.dataset.pane !== tab));
    refreshActive();
  }

  // checkServerVersion polls /api/version each refresh tick. If the
  // server's start_ms differs from the value we captured at page
  // load, the binary was rebuilt+restarted underneath us and the JS
  // in this tab is stale — reload so the user sees the new UI
  // without having to remember to hard-refresh. Failures are
  // swallowed silently so a single transient 5xx doesn't trigger
  // a spurious reload loop.
  let serverStartMs = null;
  async function checkServerVersion() {
    try {
      const v = await fetchJSON('/api/version');
      if (!v || typeof v.start_ms !== 'number') return;
      if (serverStartMs === null) {
        serverStartMs = v.start_ms;
        return;
      }
      if (v.start_ms !== serverStartMs) {
        console.log('[dashboard] server restarted — reloading for new UI');
        // Use replace() to avoid polluting browser history.
        location.replace(location.href);
      }
    } catch (_) { /* silent */ }
  }

  function refreshActive() {
    renderSummary();
    if (state.tab === 'queries')    renderQueries();
    if (state.tab === 'heuristics') renderHeuristics();
    if (state.tab === 'topics')     renderTopics();
    if (state.tab === 'decisions')  renderDecisions();
    if (state.tab === 'flows')      renderFlows();
    checkServerVersion();
    $('#last-refresh').textContent = 'refreshed ' + fmt.time(Date.now());
  }

  function reschedule() {
    if (state.timer) clearInterval(state.timer);
    if (!state.autoRefresh) return;
    state.timer = setInterval(refreshActive, Math.max(1, state.intervalSec) * 1000);
  }

  // ---------- Wire up ----------
  $$('nav.tabs button').forEach(b => b.addEventListener('click', () => setActiveTab(b.dataset.tab)));
  $('#auto-refresh').addEventListener('change', e => { state.autoRefresh = e.target.checked; reschedule(); });
  $('#refresh-interval').addEventListener('change', e => { state.intervalSec = Number(e.target.value) || 3; reschedule(); });
  $('#decisions-repo').addEventListener('change', e => { state.decisionsRepo = e.target.value; renderDecisions(); });
  $('#decisions-type').addEventListener('change', e => { state.decisionsType = e.target.value; renderDecisions(); });
  $('#decisions-clear-filters').addEventListener('click', () => {
    state.decisionsRepo = state.decisionsType = '';
    renderDecisions();
  });
  $('#flows-repo').addEventListener('change', e => { state.flowsRepo = e.target.value; renderFlows(); });
  $('#flows-topic').addEventListener('change', e => { state.flowsTopic = e.target.value; renderFlows(); });
  $('#flows-clear-filters').addEventListener('click', () => {
    state.flowsRepo = state.flowsTopic = '';
    renderFlows();
  });
  // Delegate the expand/collapse toggle off the flows pane root so we
  // don't have to rebind on every render. data-flow-toggle holds the
  // "<repo>::<name>" key that selects which card to flip.
  $('#flows-body').addEventListener('click', e => {
    const btn = e.target.closest('[data-flow-toggle]');
    if (!btn) return;
    const key = btn.dataset.flowToggle;
    if (state.expandedFlows.has(key)) state.expandedFlows.delete(key);
    else state.expandedFlows.add(key);
    renderFlows();
  });
  // Per-flow depth slider — listens on the pane root for the same
  // reason. We use the 'input' event (fires on every tick) so the
  // graph updates live as the user drags; renderFlows is cheap.
  $('#flows-body').addEventListener('input', e => {
    const slider = e.target.closest('[data-flow-depth]');
    if (!slider) return;
    const key = slider.dataset.flowDepth;
    state.flowDepth.set(key, Number(slider.value));
    renderFlows();
  });
  // Preserve per-flow horizontal scroll across auto-refresh rerenders.
  $('#flows-body').addEventListener('scroll', e => {
    const wrap = e.target.closest('.flow-full-wrap[data-flow-scroll]');
    if (!wrap) return;
    const key = wrap.dataset.flowScroll;
    if (!key) return;
    state.flowScroll.set(key, wrap.scrollLeft);
  }, true);
  $('#topics-intent').addEventListener('change', e => { state.topicsIntent = e.target.value; renderTopics(); });
  $('#topics-repo').addEventListener('change', e => { state.topicsRepo = e.target.value; renderTopics(); });
  $('#topics-clear-filters').addEventListener('click', () => {
    state.topicsRepo = state.topicsIntent = '';
    renderTopics();
  });
  $('#heuristics-repo').addEventListener('change',   e => { state.heuristicsRepo   = e.target.value; renderHeuristics(); });
  $('#heuristics-intent').addEventListener('change', e => { state.heuristicsIntent = e.target.value; renderHeuristics(); });
  $('#heuristics-clear-filters').addEventListener('click', () => {
    state.heuristicsRepo = state.heuristicsIntent = '';
    renderHeuristics();
  });
  $('#queries-repo').addEventListener('change',   e => { state.queriesRepo   = e.target.value; renderQueries(); });
  $('#queries-topic').addEventListener('change',  e => { state.queriesTopic  = e.target.value; renderQueries(); });
  $('#queries-intent').addEventListener('change', e => { state.queriesIntent = e.target.value; renderQueries(); });
  $('#queries-clear-filters').addEventListener('click', () => {
    state.queriesRepo = state.queriesTopic = state.queriesIntent = '';
    renderQueries();
  });

  // Initial paint.
  refreshRepos().then(() => { refreshActive(); reschedule(); });
})();
</script>
</body>
</html>
